<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rakazo mockup — connected tool routing</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#09090b; color:#ececee; }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -30%,#292931,#0b0b0d 52%)} button{font:inherit;cursor:pointer}
      main{max-width:940px;margin:0 auto;padding:40px 24px}.eyebrow{margin:0 0 12px 4px;color:#85858b;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.window{overflow:hidden;border:1px solid #2b2b31;border-radius:26px;background:#141416;box-shadow:0 40px 90px #0009}header{padding:24px 30px 20px;border-bottom:1px solid #29292e}h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}header p{margin:5px 0 0;color:#85858b;font-size:13px}.beats{display:flex;gap:7px;flex-wrap:wrap;padding:16px 30px;border-bottom:1px solid #29292e}.beats button{border:1px solid #383840;border-radius:999px;background:transparent;color:#a2a2aa;padding:7px 12px;font-size:12px}.beats button.active{border-color:#656fd8;background:#262a54;color:#f4f4f5}.chat{min-height:455px;padding:30px;background:#0e0e10}.user{display:flex;justify-content:flex-end}.user span{max-width:72%;border-radius:22px;background:#f2f2f3;color:#171719;padding:13px 18px;font-size:15px}.activity{width:min(100%,600px);margin-top:24px;border:1px solid #2c2c32;border-radius:20px;background:#1a1a1d;padding:17px 18px}.head{display:flex;align-items:flex-start;gap:12px}.mark{display:grid;place-items:center;width:19px;height:19px;border-radius:6px;background:#262a54;color:#d7d9ff;font-size:13px;line-height:1}.activity.browser .mark{background:#3b3020;color:#ffd788}.activity.done .mark{background:#1f5535;color:#e1ffeb}.copy{flex:1}.action{font-size:15px;font-weight:500}.meta{margin-top:4px;color:#85858b;font-size:12.5px}.elapsed{color:#85858b;font:12px ui-monospace,monospace}.trail{margin:14px 0 0;border-top:1px solid #2c2c32;padding-top:12px;color:#a9a9b0;font-size:12px;line-height:1.8}.trail div::before{content:'·';margin-right:8px;color:#74747c}.note{margin:17px 30px 0;color:#85858b;font-size:12px;line-height:1.5}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
  </head>
  <body>
    <main><p class="eyebrow">Draft design-spec reel · connected tool routing</p><section class="window"><header><h1>Use the right connected app</h1><p>Connected work starts with the app—not an unnecessary browser.</p></header><nav class="beats" aria-label="Storyboard beats"><button class="active" data-scene="ask">1 · Ask</button><button data-scene="choose">2 · Use Drive</button><button data-scene="search">3 · Find action</button><button data-scene="account">4 · Choose account</button><button data-scene="fallback">5 · Browser fallback</button></nav><div class="chat"><div class="user"><span>Find recent proposals in my Google Drive</span></div><article id="card" class="activity"><div class="head"><span id="mark" class="mark">✦</span><div class="copy"><div id="action" class="action">Getting ready</div><div id="meta" class="meta">Preparing your connected tools</div></div><span id="time" class="elapsed">0.8s</span></div><div id="trail" class="trail"></div></article></div><p id="note" class="note"></p></section></main>
    <script>
      const scenes={ask:{action:'Getting ready',meta:'Preparing your connected tools',time:'0.8s',trail:['Google Drive is connected'],note:'A normal request starts in the existing transcript.'},choose:{action:'Using Google Drive',meta:'Google Drive · Personal',time:'1.3s',trail:['Matched the connected Google Drive app','Browser control has not started'],note:'Rakazo recognizes the connected app before Pi chooses a tool.'},search:{action:'Finding the right Drive action',meta:'Google Drive · Personal',time:'2.1s',trail:['Searching available Google Drive actions','Preparing a file search'],note:'Connected-app actions are discovered on demand; no direct list-files button is required.'},account:{action:'Choose a Google Drive account',meta:'Ari needs your choice before searching files',time:'2.5s',trail:['Two Drive accounts are available','No default applies'],note:'A short account question replaces guessing or using the wrong account.'},fallback:{action:'Using browser control',meta:'No connected-app action is available for this request',time:'3.6s',trail:['No matching action was found','Switching to the browser with the reason shown'],note:'Browser is an honest fallback, never the first choice for connected-app work.',kind:'browser'}};
      const card=document.querySelector('#card');function show(key){const s=scenes[key];document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===key));card.className='activity '+(s.kind||'');document.querySelector('#action').textContent=s.action;document.querySelector('#meta').textContent=s.meta;document.querySelector('#time').textContent=s.time;document.querySelector('#trail').innerHTML=s.trail.map(x=>`<div>${x}</div>`).join('');document.querySelector('#note').textContent=s.note;document.querySelector('#mark').textContent=s.kind?'◌':'✦'}document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.scene)));show('ask');
    </script>
  </body>
</html>
